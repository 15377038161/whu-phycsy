services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wuda_quantum
      POSTGRES_USER: wuda
      POSTGRES_PASSWORD: local-only-password
    volumes:
      - local_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wuda -d wuda_quantum"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    env_file: .env.local
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://wuda:local-only-password@db:5432/wuda_quantum
      DATA_DIR: /data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - local_files:/data
volumes:
  local_postgres:
  local_files:
