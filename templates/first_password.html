{% extends "base.html" %}
{% block title %}首次登录设置密码{% endblock %}
{% block content %}
<main class="first-password-page page-pad">
  <section class="first-password-card" aria-labelledby="firstPasswordTitle">
    <span class="eyebrow">ACCOUNT SECURITY</span>
    <h1 id="firstPasswordTitle">首次登录，请设置新密码</h1>
    <p>为了保护实验数据，临时密码只能用于首次登录。新密码至少 8 位，并同时包含字母和数字。</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>当前临时密码<input name="current_password" type="password" autocomplete="current-password" required></label>
      <label>新密码<input name="new_password" type="password" minlength="8" autocomplete="new-password" required></label>
      <label>确认新密码<input name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></label>
      <button class="primary wide">保存新密码并进入平台</button>
    </form>
  </section>
</main>
{% endblock %}
